<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 190" width="680" height="190" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>autoflow — AI automation</title>
  <desc>Two flowing curved lines, amber (human) and indigo (AI), meeting at a single apex point</desc>
  <rect width="680" height="190" fill="#f8fafc"/>
  <path d="M 105,52 C 92,72 74,114 62,162" stroke="#f59e0b" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <path d="M 105,52 C 118,72 136,114 148,162" stroke="#4f46e5" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <circle cx="105" cy="52" r="4" fill="#1e1b4b"/>
  <text font-family="Arial,Helvetica,sans-serif" x="185" y="122" font-size="46" font-weight="500" fill="#1e1b4b" letter-spacing="-0.5">autoflow</text>
  <text font-family="Arial,Helvetica,sans-serif" x="187" y="150" font-size="12" fill="#94a3b8" letter-spacing="3.5">AI automation</text>
</svg>
